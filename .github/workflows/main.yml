name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main # 触发条件：有代码推送到 main 分支

jobs:
  ci-phase:
    name: CI Phase
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag_image.outputs.timestamp }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Print all current environment variables & install dependencies
        run: |
          printenv
          pip install -r requirements.txt

      - name: 3. Generate Timestamp Tag
        id: tag_image
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: 4 & 5. Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 2 & 6. Build and Push Docker image
        run: |
          IMAGE_NAME="${{ vars.DOCKER_USERNAME }}/simple-backend:${{ steps.tag_image.outputs.timestamp }}"
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: 7. Export the built image as a .tar archive
        run: |
          IMAGE_NAME="${{ vars.DOCKER_USERNAME }}/simple-backend:${{ steps.tag_image.outputs.timestamp }}"
          docker save $IMAGE_NAME -o backend-image.tar

      - name: 8. Upload the tar archive
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-tar
          path: backend-image.tar

      - name: 9. Print the final image version information
        run: |
          echo "Final image version: ${{ vars.DOCKER_USERNAME }}/simple-backend:${{ steps.tag_image.outputs.timestamp }}"

  cd-phase:
    name: CD Phase
    needs: ci-phase
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [DEV, PROD] # 分别在 DEV 和 PROD 两个环境运行
    environment: ${{ matrix.environment }}
    
    steps:
      - name: 1. Download the previously uploaded tar archive
        uses: actions/download-artifact@v4
        with:
          name: backend-image-tar

      - name: Load image to local Docker
        run: docker load -i backend-image.tar

      - name: 2. Retag the downloaded image
        run: |
          ORIGINAL_IMAGE="${{ vars.DOCKER_USERNAME }}/simple-backend:${{ needs.ci-phase.outputs.image_tag }}"
          NEW_IMAGE="${ORIGINAL_IMAGE}${{ vars.suffix }}"
          docker tag $ORIGINAL_IMAGE $NEW_IMAGE
          echo "Retagged image as: $NEW_IMAGE"

      - name: 3. List local images
        run: docker images